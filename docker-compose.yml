version: "1.1"

networks:
  doth_network:
    ipam:
      config:
        - subnet: 192.168.1.0/24

services:
  postgres:
    image: postgres:17.4
    container_name: doth-postgres
    restart: on-failure
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # The real role and database, not the placeholder myuser/mydatabase,
      # which do not exist and logged a FATAL every ten seconds
      # (docker-compose.prod.yml has the same fix).
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      doth_network:
        ipv4_address: 192.168.1.101

  backend:
    build: backend/
    container_name: doth-backend
    volumes:
      - ./backend:/backend
      # Absolute host path, deliberately outside the project directory: the
      # deploy rsyncs the project with --delete, so a backup stored under it
      # would be erased by the next deploy.
      - /var/backups/moa:/backups
    env_file:
      - .env
    depends_on:
      - postgres
    command: >
      python main.py
    restart: on-failure
    ports:
      - "8000:8000"
    networks:
      doth_network:
        ipv4_address: 192.168.1.100

volumes:
  postgres_data:
