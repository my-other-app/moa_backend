name: Lint & Test

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # New migrations only (after the cutoff revision): what would lock a
      # hot table or rewrite it while production serves. Standard library only.
      - run: python scripts/check_migrations.py

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moa_backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The Redis paths -- the live room's board and stream bus, the shared
      # cache, the rate limits' store, the document claim -- are tested
      # against a real one, as production runs (ops/server/compose.yml).
      # Without it those tests skip and only the fallbacks run.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_SECRET_KEY: ci-test-secret-key
      APP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/moa_backend_test
      APP_DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/moa_backend_test
      APP_CORS_ORIGINS: '["http://testserver"]'
      APP_S3_BUCKET: test-bucket
      APP_S3_ACCESS_KEY: test-access-key
      APP_S3_SECRET_KEY: test-secret-key
      APP_S3_BASE_PATH: https://test-bucket.s3.amazonaws.com
      APP_SES_ACCESS_KEY: test-ses-access-key
      APP_SES_SECRET_KEY: test-ses-secret-key
      APP_SES_DEFAULT_SENDER: test@finnet.app
      APP_GOOGLE_WEB_CLIENT_ID: test-google-web-client-id
      APP_GOOGLE_ANDROID_CLIENT_ID: test-google-android-client-id
      APP_GOOGLE_IOS_CLIENT_ID: test-google-ios-client-id
      APP_RAZORPAY_KEY_ID: test-razorpay-key-id
      APP_RAZORPAY_KEY_SECRET: test-razorpay-key-secret
      APP_RAZORPAY_WEBHOOK_SECRET: test-razorpay-webhook-secret
      APP_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      APP_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      # The Redis the tests use (tests/test_redis.py, tests/test_doc_single_flight.py),
      # each on its own database. The app's own APP_REDIS_URL stays unset:
      # a test turns Redis on itself.
      APP_TEST_REDIS_URL: redis://localhost:6379/13
      APP_TEST_DOC_REDIS_URL: redis://localhost:6379/12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The backup tests run pg_dump against the service above, and pg_dump
      # refuses a server newer than itself: the runner's own client is 16.
      # Production runs postgres:17.4 and its image installs
      # postgresql-client-17 from PGDG (backend/Dockerfile); CI does the same.
      - name: Install the Postgres 17 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - run: pg_dump --version
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Fails here, not as a dozen quiet skips, if the service is not up.
      - name: Redis answers
        run: python -c "import os, redis; assert redis.from_url(os.environ['APP_TEST_REDIS_URL'], socket_timeout=5).ping()"
      - run: pytest -rs
