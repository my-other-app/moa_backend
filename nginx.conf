# nginx proxy config
server {
    listen 80;
    listen [::]:80;
    server_name api.staging.myotherapp.in;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.staging.myotherapp.in;
    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/api.staging.myotherapp.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.staging.myotherapp.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The live room's server-sent events (backend/app/api/live/stream.py):
    # one long response per phone, frames as the room changes and a ping
    # every 15 s. Passed through unbuffered (the app also says so with
    # X-Accel-Buffering: no), never cached or compressed, held for up to two
    # minutes without a byte (four pings), and let go after a minute when the
    # phone stops reading. Each open stream holds two connections here (the
    # phone's and the upstream's): worker_connections and
    # worker_rlimit_nofile in nginx.conf's main context must allow for that.
    location ~ ^/api/v1/events/\d+/live/stream$ {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 120s;
        send_timeout 60s;
    }

    location / {
        set $subdomain "";
        if ($host ~* ^([^.]+)\.pulsetap\.in$) {
            set $subdomain $1;
        }

        add_header X-Debug-Subdomain $subdomain;
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.myotherapp.in;
    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/api.myotherapp.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.myotherapp.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The live room's server-sent events (backend/app/api/live/stream.py):
    # one long response per phone, frames as the room changes and a ping
    # every 15 s. Passed through unbuffered (the app also says so with
    # X-Accel-Buffering: no), never cached or compressed, held for up to two
    # minutes without a byte (four pings), and let go after a minute when the
    # phone stops reading. Each open stream holds two connections here (the
    # phone's and the upstream's): worker_connections and
    # worker_rlimit_nofile in nginx.conf's main context must allow for that.
    location ~ ^/api/v1/events/\d+/live/stream$ {
        proxy_pass http://localhost:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 120s;
        send_timeout 60s;
    }

    location / {
        set $subdomain "";
        if ($host ~* ^([^.]+)\.pulsetap\.in$) {
            set $subdomain $1;
        }

        add_header X-Debug-Subdomain $subdomain;
        proxy_pass http://localhost:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
