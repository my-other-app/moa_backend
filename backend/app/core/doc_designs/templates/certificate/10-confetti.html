<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confetti certificate</title>
<style>
@page { size: A4 landscape; margin: 0 }
html, body { margin: 0; padding: 0 }
body { -webkit-print-color-adjust: exact; print-color-adjust: exact }
</style>
</head>
<body>
<div style="position: relative; width: 1123px; height: 794px; box-sizing: border-box; background: {{accent_color}}; color: #1B1B3A; font-family: 'Nunito', Arial, sans-serif; font-weight: 500; overflow: hidden">
<div style="position: absolute; left: 56px; top: 56px; width: 1011px; height: 682px; box-sizing: border-box; background: #FFFFFF; border: 3px solid #1B1B3A; border-radius: 36px"></div>
<svg aria-hidden="true" viewBox="0 0 1123 794" width="1123" height="794" style="position: absolute; left: 0; top: 0">
<circle cx="72" cy="84" r="46" fill="#FF5C7A" stroke="#1B1B3A" stroke-width="3"></circle>
<path d="M1034 28l48 76h-96z" fill="#2D7FF9" stroke="#1B1B3A" stroke-width="3" stroke-linejoin="round"></path>
<circle cx="64" cy="716" r="32" fill="#19B38A" stroke="#1B1B3A" stroke-width="3"></circle>
<path d="M55 36l5.6 11.4 12.6 1.8-9.1 8.9 2.1 12.5L55 64.7l-11.2 5.9 2.1-12.5-9.1-8.9 12.6-1.8z" fill="#FF5C7A" stroke="#1B1B3A" stroke-width="1" stroke-linejoin="round" transform="translate(1058 716) scale(2.6) translate(-55 -54)"></path>
<g fill="none" stroke="#1B1B3A" stroke-width="5" stroke-linecap="round">
<path d="M250 28q14-16 28 0t28 0t28 0t28 0"></path>
<path d="M760 766q14-16 28 0t28 0t28 0t28 0"></path>
</g>
<g stroke="#1B1B3A" stroke-width="2">
<circle cx="470" cy="28" r="9" fill="#2D7FF9"></circle>
<circle cx="700" cy="26" r="7" fill="#FF5C7A"></circle>
<circle cx="860" cy="30" r="10" fill="#19B38A"></circle>
<circle cx="200" cy="766" r="9" fill="#FF5C7A"></circle>
<circle cx="420" cy="768" r="7" fill="#2D7FF9"></circle>
<circle cx="600" cy="764" r="10" fill="#FFFFFF"></circle>
<circle cx="26" cy="300" r="8" fill="#2D7FF9"></circle>
<circle cx="28" cy="480" r="10" fill="#FFFFFF"></circle>
<circle cx="1096" cy="260" r="9" fill="#19B38A"></circle>
<circle cx="1094" cy="470" r="7" fill="#FF5C7A"></circle>
<rect x="1084" y="352" width="18" height="18" fill="#FFFFFF" transform="rotate(20 1093 361)"></rect>
<rect x="18" y="380" width="18" height="18" fill="#FF5C7A" transform="rotate(-18 27 389)"></rect>
</g>
</svg>
<div data-fit-box style="position: relative; width: 1123px; height: 794px; box-sizing: border-box; padding: 108px 136px 100px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<div data-fit="wrap" data-fit-lines="1" style="font-size: 16px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase">{{institute_name}}</div>
<h1 data-fit="wrap" data-fit-lines="1" data-option="title" style="margin: 0; font-family: 'Fredoka', 'Arial Rounded MT Bold', Arial, sans-serif; font-weight: 600; font-size: 48px; line-height: 1.1">Certificate of Participation</h1>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="font-size: 18px">This certificate goes to</div>
<div data-fit="wrap" data-fit-lines="2" style="font-family: 'Fredoka', 'Arial Rounded MT Bold', Arial, sans-serif; font-weight: 600; font-size: 70px; line-height: 1.1; color: #1F5FD0">{{recipient_name}}</div>
<svg aria-hidden="true" viewBox="0 0 364 20" width="364" height="20"><path d="M4 10q14-12 28 0t28 0t28 0t28 0t28 0t28 0t28 0t28 0t28 0t28 0t28 0t28 0t28 0" fill="none" stroke="#FF5C7A" stroke-width="5" stroke-linecap="round"></path></svg>
<div data-fit="wrap" data-fit-lines="3" data-option="statement" style="max-width: 640px; margin-top: 10px; font-size: 19px; line-height: 1.5; text-wrap: pretty">for joining in and giving it everything at <strong style="font-weight: 700">{{event_title}}</strong> on {{event_date}}.</div>
</div>
<div data-fit-box style="width: 100%; display: flex; justify-content: space-between; align-items: flex-end; gap: 28px">
<div data-optional="signatory_name" style="display: flex; flex-direction: column; align-items: flex-start; gap: 5px; text-align: left">
<div data-slot="signature" style="width: 210px; height: 44px; box-sizing: border-box; border-bottom: 3px solid #1B1B3A"></div>
<div data-fit="wrap" data-fit-lines="1" style="font-size: 16px; font-weight: 700">{{signatory_name}}</div>
<div data-optional="signatory_designation" style="font-size: 14px">{{signatory_designation}}</div>
</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 10px 16px 10px 10px; background: {{accent_color}}; border: 3px solid #1B1B3A; border-radius: 20px">
<div style="padding: 7px; background: #FFFFFF; border-radius: 10px; display: flex">
<img data-slot="qr" src="{{qr_code_src}}" width="84" height="84" alt="QR code to verify this certificate" style="display: block">
</div>
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left">
<div style="font-family: 'Fredoka', 'Arial Rounded MT Bold', Arial, sans-serif; font-weight: 600; font-size: 19px">Scan me to verify!</div>
<div data-fit="wrap" data-fit-lines="1" data-fit-min="40%" style="font-size: 14px; font-weight: 700">No. {{certificate_id}}</div>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
