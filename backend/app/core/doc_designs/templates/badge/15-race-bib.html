<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Race Bib ID card</title>
<style>
@page{size:4in 6in;margin:0}
html,body{margin:0;padding:0}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
:root{--accent:#FF6A3D} 
</style>
</head>
<body>
<div style="width: 384px; height: 576px; box-sizing: border-box; background: #FFFFFF; color: #111111; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
<div style="height: 104px; flex-shrink: 0; box-sizing: border-box; background: var(--accent); padding: 16px 28px 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
<div data-lanyard aria-hidden="true" style="width: 56px; height: 12px; border-radius: 6px; background: #FFFFFF"></div>
<div data-fit-box style="align-self: stretch; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px">
<div data-fit="name" style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 22px; line-height: 1.1">{{org_name}}</div>
<div style="font-size: 12px; font-weight: 600; line-height: 1.4; text-align: right; white-space: nowrap">{{event_name}}<br>{{event_date}}</div>
</div>
</div>
<div style="padding: 10px 28px 0; display: flex; flex-direction: column; align-items: center">
<div data-fit="code" style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 128px; line-height: 1; letter-spacing: -0.05em">{{bib_number}}</div>
<div data-fit="name" data-fit-min="18" style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.1; letter-spacing: 0.04em; text-transform: uppercase; text-align: center">{{full_name}}</div>
</div>
<div style="margin: 20px 28px 0; border: 2px solid #111111; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0">
<div style="padding: 8px 10px; display: flex; flex-direction: column; gap: 2px">
<div data-optional-hide="category" style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #555555">CATEGORY</div>
<div data-optional-hide="category" style="font-size: 18px; font-weight: 600">{{category}}</div>
</div>
<div style="padding: 8px 10px; border-left: 2px solid #111111; display: flex; flex-direction: column; gap: 2px">
<div data-optional-hide="wave" style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #555555">WAVE</div>
<div data-optional-hide="wave" style="font-size: 18px; font-weight: 600">{{wave}}</div>
</div>
<div style="padding: 8px 10px; border-left: 2px solid #111111; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #555555">START</div>
<div style="font-size: 18px; font-weight: 600">{{start_time}}</div>
</div>
</div>
<div style="margin-top: auto; padding: 0 28px 24px; display: flex; justify-content: space-between; align-items: stretch; gap: 16px">
<div data-optional-hide="sponsor_src" style="flex-grow: 1; min-width: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><img data-optional="sponsor_src" src="{{sponsor_src}}" alt="" style="display: block; max-width: 100%; max-height: 84px; object-fit: contain"></div>
<img src="{{qr_code_url}}" alt="QR code" style="width: 84px; height: 84px; display: block; flex-shrink: 0; image-rendering: pixelated">
</div>
</div>
</body>
</html>
