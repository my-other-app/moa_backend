<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night Grid ID card</title>
<style>
@page{size:4in 6in;margin:0}
html,body{margin:0;padding:0}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
:root{--accent:#6CF0C2} 
</style>
</head>
<body>
<div style="width: 384px; height: 576px; box-sizing: border-box; background-color: #0C1022; background-image: radial-gradient(#252D55 1.2px, transparent 1.4px); background-size: 16px 16px; color: #FFFFFF; font-family: 'Space Grotesk', system-ui, sans-serif; padding: 16px 28px 28px; display: flex; flex-direction: column">
<div data-lanyard aria-hidden="true" style="align-self: center; width: 56px; height: 12px; border-radius: 6px; background: #F4F6FA"></div>
<div style="margin-top: 20px; font-family: 'Space Mono', ui-monospace, monospace; font-size: 13px; line-height: 1.6; display: flex; flex-direction: column">
<div data-fit="line" style="color: var(--accent); font-weight: 700">&gt; {{event_name}}</div>
<div data-fit="line" style="color: #B4BDE0">// <span data-optional="event_tagline">{{event_tagline}} · </span>{{event_date}}</div>
</div>
<div data-fit="name" data-fit-min="18" style="margin-top: 38px; font-weight: 700; font-size: 60px; line-height: 0.95; letter-spacing: -0.03em">{{first_name}}<span data-optional="last_name"><br>{{last_name}}</span></div>
<div data-optional="team_name" style="margin-top: 14px; font-family: 'Space Mono', ui-monospace, monospace; font-size: 14px; color: #B4BDE0">team: {{team_name}}</div>
<div data-fit="name" data-fit-min="18" style="margin-top: 22px; align-self: flex-start; border: 2px solid var(--accent); color: var(--accent); font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700; font-size: 22px; letter-spacing: 0.12em; padding: 6px 14px; background: #0C1022">{{role}}</div>
<div style="margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 13px; line-height: 1.7; display: flex; flex-direction: column">
<div><span style="color: #B4BDE0">id&nbsp;&nbsp;&nbsp;&nbsp;</span>{{badge_id}}</div>
<div data-optional="table_no"><span style="color: #B4BDE0">table&nbsp;</span>{{table_no}}</div>
<div data-optional="track"><span style="color: #B4BDE0">track&nbsp;</span>{{track}}</div>
</div>
<div style="background: #FFFFFF; padding: 8px; border-radius: 4px; flex-shrink: 0">
<img src="{{qr_code_url}}" alt="QR code" style="width: 84px; height: 84px; display: block; image-rendering: pixelated">
</div>
</div>
</div>
</body>
</html>
