<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thermal Mono ID card</title>
<style>
@page{size:4in 6in;margin:0}
html,body{margin:0;padding:0}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}

</style>
</head>
<body>
<div style="width: 384px; height: 576px; box-sizing: border-box; background: #FFFFFF; color: #000000; font-family: 'Space Grotesk', system-ui, sans-serif; padding: 12px">
<div style="width: 100%; height: 100%; box-sizing: border-box; border: 3px solid #000000; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column">
<div style="padding: 10px 0; display: flex; justify-content: center">
<div data-lanyard aria-hidden="true" style="width: 56px; height: 12px; border-radius: 6px; border: 2px solid #000000; box-sizing: border-box"></div>
</div>
<div data-fit-box style="background: #000000; color: #FFFFFF; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px">
<div data-fit="name" style="font-weight: 700; font-size: 18px; letter-spacing: 0.02em">{{event_name}}</div>
<div style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 12px">{{event_date}}</div>
</div>
<div style="padding: 22px 20px 0; display: flex; flex-direction: column; gap: 6px">
<div data-fit="name" data-fit-min="18" style="font-weight: 700; font-size: 74px; line-height: 0.9; letter-spacing: -0.04em; text-transform: uppercase">{{first_name}}</div>
<div data-fit="name" data-fit-min="18" data-optional="last_name" style="font-weight: 500; font-size: 32px; line-height: 1.1">{{last_name}}</div>
<div data-fit="line" data-optional="organization" style="margin-top: 8px; font-family: 'Space Mono', ui-monospace, monospace; font-size: 14px">{{organization}}</div>
</div>
<div style="margin: 20px 20px 0; border-top: 2px dashed #000000; padding-top: 18px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px">
<div style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 13px; line-height: 1.5; display: flex; flex-direction: column; gap: 8px">
<div data-optional-any="checkin_time kiosk_id"><strong>CHECK-IN</strong><br><span data-optional="checkin_time">{{checkin_time}}</span><span data-optional="checkin_time kiosk_id"> · </span><span data-optional="kiosk_id">KIOSK {{kiosk_id}}</span></div>
<div><strong>BADGE</strong><br>{{badge_id}}</div>
</div>
<img src="{{qr_code_url}}" alt="QR code" style="width: 108px; height: 108px; display: block; flex-shrink: 0; image-rendering: pixelated">
</div>
<div data-fit-box style="margin-top: auto; background: #000000; color: #FFFFFF; height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px">
<div data-fit="name" data-fit-min="18" style="font-weight: 700; font-size: 36px; letter-spacing: 0.14em; line-height: 1">{{role}}</div>
<div style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 12px; text-align: right; line-height: 1.4"><span data-optional="access_level">{{access_level}}</span><span data-optional="access_level zone"><br></span><span data-optional="zone">ZONE {{zone}}</span></div>
</div>
</div>
</div>
</body>
</html>
