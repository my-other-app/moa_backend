<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fine Line ID card</title>
<style>
@page{size:4in 6in;margin:0}
html,body{margin:0;padding:0}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
:root{--accent:#B4532A} 
</style>
</head>
<body>
<div style="width: 384px; height: 576px; box-sizing: border-box; background: #FBFBF9; color: #1A1A1A; font-family: Inter, system-ui, sans-serif; padding: 16px 32px 32px; display: flex; flex-direction: column">
<div data-lanyard aria-hidden="true" style="align-self: center; width: 56px; height: 12px; border-radius: 6px; background: #FFFFFF; border: 1.5px solid #1A1A1A; box-sizing: border-box"></div>
<div data-fit-box style="margin-top: 20px; padding-bottom: 14px; border-bottom: 1px solid #1A1A1A; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 500; letter-spacing: 0.2em">
<div data-fit="name">{{org_name}}</div>
<div>No. {{member_id}}</div>
</div>
<div data-optional="membership_tier" style="margin-top: auto; display: flex; align-items: center; gap: 10px">
<div aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: var(--accent)"></div>
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.2em">{{membership_tier}}</div>
</div>
<div data-fit="name" data-fit-min="18" style="margin-top: 14px; font-family: 'Instrument Serif', Georgia, serif; font-size: 60px; line-height: 0.98; letter-spacing: -0.01em">{{first_name}}<span data-optional="last_name"><br>{{last_name}}</span></div>
<div style="margin-top: 26px; padding-top: 14px; border-top: 1px solid #1A1A1A; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 500">
<div data-optional="member_since_year">Member since {{member_since_year}}</div>
<div>Valid {{valid_thru}}</div>
</div>
<div style="margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px">
<div style="font-size: 12px; line-height: 1.5; color: #555555">Present this card at the front desk. Non-transferable.</div>
<img src="{{qr_code_url}}" alt="QR code" style="width: 76px; height: 76px; display: block; flex-shrink: 0; image-rendering: pixelated">
</div>
</div>
</body>
</html>
