<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Polaroid ID card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=Caveat:wght@600&display=swap">
<style>
@page{size:4in 6in;margin:0}
html,body{margin:0;padding:0}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
:root{--accent:#5B3DF5} 
</style>
</head>
<body>
<div style="width: 384px; height: 576px; box-sizing: border-box; overflow: hidden; background: #E6E1FF; color: #1B1440; font-family: Inter, system-ui, sans-serif; padding: 16px 28px 28px; display: flex; flex-direction: column; align-items: center">
<div aria-hidden="true" style="width: 56px; height: 12px; border-radius: 6px; background: #FFFFFF; border: 1.5px solid #1B1440; box-sizing: border-box"></div>
<div style="align-self: stretch; margin-top: 16px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; letter-spacing: 0.14em">
<div>{{org_name}}</div>
<div>{{city}}</div>
</div>
<div style="position: relative; margin-top: 24px; width: 196px; height: 226px; box-sizing: border-box; background: #FFFFFF; padding: 10px 10px 0; transform: rotate(-4deg); box-shadow: 6px 6px 0 #1B1440; display: flex; flex-direction: column; align-items: center">
<div aria-hidden="true" style="position: absolute; top: -11px; left: 70px; width: 56px; height: 20px; background: #FFD95A; transform: rotate(3deg)"></div>
<div style="width: 176px; height: 172px; background: #CFC8F5; overflow: hidden; display: flex; align-items: flex-end; justify-content: center">
<img src="{{photo_url}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
</div>
<div style="flex-grow: 1; display: flex; align-items: center; font-family: Caveat, cursive; font-weight: 600; font-size: 24px; line-height: 1">member since {{member_since_year}}</div>
</div>
<div style="margin-top: 30px; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 36px; line-height: 1; letter-spacing: -0.02em; text-align: center">{{full_name}}</div>
<div style="margin-top: 12px; background: var(--accent); color: #FFFFFF; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; padding: 7px 16px; border-radius: 999px">{{role}}</div>
<div style="align-self: stretch; margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #453C78">MEMBER NO.</div>
<div style="font-size: 18px; font-weight: 600">{{member_id}}</div>
<div style="margin-top: 6px; font-size: 12px; font-weight: 500; color: #453C78">Scan to view profile</div>
</div>
<div style="background: #FFFFFF; padding: 7px; border-radius: 10px; flex-shrink: 0">
<img src="{{qr_code_url}}" alt="QR code" style="width: 78px; height: 78px; display: block; image-rendering: pixelated">
</div>
</div>
</div>
</body>
</html>
