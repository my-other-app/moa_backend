<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colour Blocks ID card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
@page{size:4in 6in;margin:0}
html,body{margin:0;padding:0}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}

</style>
</head>
<body>
<div style="width: 384px; height: 576px; box-sizing: border-box; overflow: hidden; background: #F7F7F2; color: #141414; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
<div style="height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center">
<div aria-hidden="true" style="width: 56px; height: 12px; border-radius: 6px; background: #FFFFFF; border: 1.5px solid #141414; box-sizing: border-box"></div>
</div>
<div aria-hidden="true" style="flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0">
<div style="height: 128px; background: #E4432D"><div style="width: 128px; height: 128px; border-radius: 50%; background: #F5B921"></div></div>
<div style="height: 128px; background: #F7F7F2"><div style="width: 128px; height: 128px; border-radius: 0 128px 0 0; background: #2447C9"></div></div>
<div style="height: 128px; background: #141414; display: flex; align-items: flex-end"><div style="width: 128px; height: 64px; border-radius: 64px 64px 0 0; background: #F7F7F2"></div></div>
<div style="height: 128px; background: #2447C9"><div style="width: 128px; height: 128px; border-radius: 0 0 0 128px; background: #F7F7F2"></div></div>
<div style="height: 128px; background: #F5B921; display: flex; align-items: center; justify-content: center"><div style="width: 64px; height: 64px; border-radius: 50%; background: #141414"></div></div>
<div style="height: 128px; background: #F7F7F2"><div style="width: 128px; height: 128px; border-radius: 128px 0 0 0; background: #E4432D"></div></div>
</div>
<div style="flex-grow: 1; box-sizing: border-box; padding: 22px 28px 24px; display: flex; flex-direction: column">
<div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 36px; line-height: 1; letter-spacing: -0.02em">{{full_name}}</div>
<div style="margin-top: 8px; font-size: 15px; font-weight: 500; color: #3A3A36">{{org_name}} · {{chapter}}</div>
<div style="margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px">
<div style="background: #141414; color: #FFFFFF; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.1em; padding: 8px 14px">{{role}}</div>
<div style="font-size: 13px; font-weight: 600">No. {{member_id}} · Valid {{valid_thru}}</div>
</div>
<img src="{{qr_code_url}}" alt="QR code" style="width: 88px; height: 88px; display: block; flex-shrink: 0; image-rendering: pixelated">
</div>
</div>
</div>
</body>
</html>
