<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Role Rail ID card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
@page{size:4in 6in;margin:0}
html,body{margin:0;padding:0}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
:root{--accent:#D63A22} 
</style>
</head>
<body>
<div style="width: 384px; height: 576px; box-sizing: border-box; position: relative; background: #FFFFFF; color: #17130F; font-family: Inter, system-ui, sans-serif; display: flex">
<div aria-hidden="true" style="position: absolute; left: 164px; top: 16px; width: 56px; height: 12px; border-radius: 6px; background: #FFFFFF; border: 1.5px solid #17130F; box-sizing: border-box"></div>
<div style="width: 76px; flex-shrink: 0; background: var(--accent); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<div style="writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 46px; letter-spacing: 0.12em; line-height: 1">{{role}}</div>
</div>
<div style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 46px 24px 24px; display: flex; flex-direction: column">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #55504A">{{event_name}} · {{event_year}}</div>
<div style="margin-top: 18px; width: 148px; height: 148px; border-radius: 50%; background: #EFE9E4; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; box-shadow: 0 0 0 4px #FFFFFF, 0 0 0 6px var(--accent)">
<img src="{{photo_url}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
</div>
<div style="margin-top: 22px; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 38px; line-height: 1; letter-spacing: -0.02em">{{first_name}}<br>{{last_name}}</div>
<div style="margin-top: 8px; font-size: 15px; font-weight: 500; color: #3B3631">{{job_title}} · {{organization}}</div>
<div style="margin-top: auto; border-top: 2px solid #17130F; padding-top: 14px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #55504A">SESSION</div>
<div style="font-size: 14px; font-weight: 600; line-height: 1.25">{{session_hall}} · {{session_time}}</div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #55504A">ACCESS</div>
<div style="font-size: 14px; font-weight: 600; line-height: 1.25">{{access_level}}</div>
</div>
</div>
<img src="{{qr_code_url}}" alt="QR code" style="width: 92px; height: 92px; display: block; flex-shrink: 0; image-rendering: pixelated">
</div>
</div>
</div>
</body>
</html>
