<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Role Rail ID card</title>
<style>
@page{size:4in 6in;margin:0}
html,body{margin:0;padding:0}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
:root{--accent:#D63A22} 
</style>
</head>
<body>
<div style="width: 384px; height: 576px; box-sizing: border-box; position: relative; background: #FFFFFF; color: #17130F; font-family: Inter, system-ui, sans-serif; display: flex">
<div data-lanyard aria-hidden="true" style="position: absolute; left: 164px; top: 16px; width: 56px; height: 12px; border-radius: 6px; background: #FFFFFF; border: 1.5px solid #17130F; box-sizing: border-box"></div>
<div style="width: 76px; flex-shrink: 0; background: var(--accent); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<div data-fit="name" data-fit-min="18" style="writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 46px; letter-spacing: 0.12em; line-height: 1">{{role}}</div>
</div>
<div style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 46px 24px 24px; display: flex; flex-direction: column">
<div data-fit="line" style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #55504A"><span data-optional="event_name">{{event_name}}</span><span data-optional="event_name event_year"> · </span><span data-optional="event_year">{{event_year}}</span></div>
<div style="margin-top: 18px; width: 148px; height: 148px; border-radius: 50%; background: #EFE9E4; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; box-shadow: 0 0 0 4px #FFFFFF, 0 0 0 6px var(--accent)">
<img data-slot="photo" src="{{photo_url}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
</div>
<div data-fit="name" data-fit-min="18" style="margin-top: 22px; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 38px; line-height: 1; letter-spacing: -0.02em">{{first_name}}<span data-optional="last_name"><br>{{last_name}}</span></div>
<div data-optional-any="job_title organization" data-fit="line" style="margin-top: 8px; font-size: 15px; font-weight: 500; color: #3B3631"><span data-optional="job_title">{{job_title}}</span><span data-optional="job_title organization"> · </span><span data-optional="organization">{{organization}}</span></div>
<div style="margin-top: auto; border-top: 2px solid #17130F; padding-top: 14px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
<div data-optional-any="session_hall session_time" style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #55504A">SESSION</div>
<div data-fit="line" style="font-size: 14px; font-weight: 600; line-height: 1.25"><span data-optional="session_hall">{{session_hall}}</span><span data-optional="session_hall session_time"> · </span><span data-optional="session_time">{{session_time}}</span></div>
</div>
<div data-optional="access_level" style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #55504A">ACCESS</div>
<div data-fit="line" style="font-size: 14px; font-weight: 600; line-height: 1.25">{{access_level}}</div>
</div>
</div>
<img src="{{qr_code_url}}" alt="QR code" style="width: 92px; height: 92px; display: block; flex-shrink: 0; image-rendering: pixelated">
</div>
</div>
</div>
</body>
</html>
