<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden Party Ticket</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,700&family=DM+Sans:wght@500;700&display=swap">
<style>body{margin:0}</style>
</head>
<body>
<!-- Ticket template: 06-garden-party. Fixed canvas 1280x600 (ticket itself 1140x460, centred). Tokens: {{token}}. QR goes in [data-slot="qr"]. See README.md -->
<div class="ticket-stage" style="width: 1280px; height: 600px; box-sizing: border-box; background: #EFE4CF; display: flex; align-items: center; justify-content: center; font-family: 'DM Sans', sans-serif">
<div style="position: relative; width: 1140px; height: 460px; display: flex; filter: drop-shadow(0 22px 34px rgba(23, 63, 46, 0.28))">

<div style="width: 320px; box-sizing: border-box; padding: 32px 30px; background: #FBF3E0; color: #173F2E; border-radius: 30px 0 0 30px; border-right: 3px dotted #173F2E; display: flex; flex-direction: column; align-items: center; justify-content: space-between">
<div style="width: 100%; display: flex; align-items: center; justify-content: space-between">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.16em; padding: 7px 14px; border-radius: 999px; background: #173F2E; color: #FBF3E0">{{ticket_type}}</div>
<div style="font-size: 14px; font-weight: 700; letter-spacing: 0.08em">{{ticket_id}}</div>
</div>
<div data-slot="qr" role="img" aria-label="Ticket QR code" style="position: relative; width: 190px; height: 190px; box-sizing: border-box; background: #FFFFFF; border: 2px solid #173F2E; border-radius: 22px; display: flex; align-items: center; justify-content: center">
<div style="position: absolute; left: 16px; top: 16px; width: 40px; height: 40px; box-sizing: border-box; border: 7px solid #173F2E; border-radius: 8px; display: flex; align-items: center; justify-content: center"><div style="width: 12px; height: 12px; border-radius: 3px; background: #173F2E"></div></div>
<div style="position: absolute; right: 16px; top: 16px; width: 40px; height: 40px; box-sizing: border-box; border: 7px solid #173F2E; border-radius: 8px; display: flex; align-items: center; justify-content: center"><div style="width: 12px; height: 12px; border-radius: 3px; background: #173F2E"></div></div>
<div style="position: absolute; left: 16px; bottom: 16px; width: 40px; height: 40px; box-sizing: border-box; border: 7px solid #173F2E; border-radius: 8px; display: flex; align-items: center; justify-content: center"><div style="width: 12px; height: 12px; border-radius: 3px; background: #173F2E"></div></div>
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em">[QR CODE]</div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #4B6657">A PLACE SAVED FOR</div>
<div style="font-family: 'Fraunces', serif; font-style: italic; font-size: 24px; font-weight: 700">{{attendee_name}}</div>
</div>
</div>

<div style="position: relative; width: 820px; box-sizing: border-box; padding: 38px 46px; background: #173F2E; color: #FBF3E0; border-radius: 0 30px 30px 0; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between">

<svg aria-hidden="true" width="820" height="460" viewBox="0 0 820 460" style="position: absolute; left: 0; top: 0">
<g transform="translate(700 90) rotate(-35)"><path d="M0 0 C50 -70 150 -70 200 0 C150 70 50 70 0 0 Z" fill="#2B7350"></path><path d="M0 0 H200" stroke="#173F2E" stroke-width="3"></path></g>
<g transform="translate(610 20) rotate(20)"><path d="M0 0 C40 -56 120 -56 160 0 C120 56 40 56 0 0 Z" fill="#1F5A40"></path><path d="M0 0 H160" stroke="#173F2E" stroke-width="3"></path></g>
<g transform="translate(830 250) rotate(-150)"><path d="M0 0 C55 -78 165 -78 220 0 C165 78 55 78 0 0 Z" fill="#3C8F63"></path><path d="M0 0 H220" stroke="#173F2E" stroke-width="3"></path></g>
<g transform="translate(840 470) rotate(-125)"><path d="M0 0 C50 -70 150 -70 200 0 C150 70 50 70 0 0 Z" fill="#1F5A40"></path><path d="M0 0 H200" stroke="#173F2E" stroke-width="3"></path></g>
<g transform="translate(560 500) rotate(-70)"><path d="M0 0 C36 -50 104 -50 140 0 C104 50 36 50 0 0 Z" fill="#2B7350"></path><path d="M0 0 H140" stroke="#173F2E" stroke-width="3"></path></g>
<g transform="translate(690 330)">
<circle cx="0" cy="-26" r="22" fill="#FF9EB5"></circle><circle cx="25" cy="-8" r="22" fill="#FF9EB5"></circle><circle cx="15" cy="21" r="22" fill="#FF9EB5"></circle><circle cx="-15" cy="21" r="22" fill="#FF9EB5"></circle><circle cx="-25" cy="-8" r="22" fill="#FF9EB5"></circle><circle cx="0" cy="0" r="16" fill="#F5B83D"></circle>
</g>
<g transform="translate(772 176) scale(0.55)">
<circle cx="0" cy="-26" r="22" fill="#FBF3E0"></circle><circle cx="25" cy="-8" r="22" fill="#FBF3E0"></circle><circle cx="15" cy="21" r="22" fill="#FBF3E0"></circle><circle cx="-15" cy="21" r="22" fill="#FBF3E0"></circle><circle cx="-25" cy="-8" r="22" fill="#FBF3E0"></circle><circle cx="0" cy="0" r="16" fill="#F5B83D"></circle>
</g>
</svg>

<div style="position: relative; display: flex; align-items: center; gap: 12px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F5B83D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.800 6.100C15.500 5 17 4.480 19 2c1 2 2 4.180 2 8 0 5.500-4.780 10-10 10Z"></path><path d="M2 21c0-3 1.850-5.360 5.080-6C9.500 14.520 12 13 13 12"></path></svg>
<div style="font-size: 15px; font-weight: 700; letter-spacing: 0.18em">{{app_name}}</div>
</div>

<div style="position: relative; max-width: 560px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; font-weight: 700; letter-spacing: 0.22em; color: #F5B83D">YOU ARE INVITED TO</div>
<h1 style="margin: 0; font-family: 'Fraunces', serif; font-style: italic; font-size: 80px; line-height: 0.98; font-weight: 700; letter-spacing: -0.01em">{{event_name}}</h1>
<div style="font-size: 20px; font-weight: 500; color: #FFC2D0">{{tagline}}</div>
</div>

<div style="position: relative; width: 520px; display: grid; grid-template-columns: 1.2fr 0.8fr 0.8fr; column-gap: 16px; row-gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px"><div style="font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #BFD9C8">DATE</div><div style="font-size: 19px; font-weight: 700">{{date}}</div></div>
<div style="display: flex; flex-direction: column; gap: 4px"><div style="font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #BFD9C8">GATES OPEN</div><div style="font-size: 19px; font-weight: 700">{{doors_time}}</div></div>
<div style="display: flex; flex-direction: column; gap: 4px"><div style="font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #BFD9C8">GATE</div><div style="font-size: 19px; font-weight: 700">{{gate}}</div></div>
<div style="grid-column: span 2; display: flex; flex-direction: column; gap: 4px"><div style="font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #BFD9C8">VENUE</div><div style="font-size: 19px; font-weight: 700">{{venue}}</div></div>
<div style="display: flex; flex-direction: column; gap: 4px"><div style="font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #BFD9C8">SEAT</div><div style="font-size: 19px; font-weight: 700">{{row}} · {{seat}}</div></div>
</div>
</div>

<div aria-hidden="true" style="position: absolute; left: 303px; top: -17px; width: 34px; height: 34px; border-radius: 50%; background: #EFE4CF"></div>
<div aria-hidden="true" style="position: absolute; left: 303px; bottom: -17px; width: 34px; height: 34px; border-radius: 50%; background: #EFE4CF"></div>

</div>
</div>
</body>
</html>
